# configuration file for params

cloudy:

  physics:

    n_iterations:   # set to None (i.e. leave empty) for one calculation
    iterate_to_convergence: True
    efrac_threshold: 0.01
    max_zones: 2000
    stop_temperature: 1000
    no_stop_temperature: True
    density_tolerance: 1.0e-4
    homogeneous: false
    use_cosmic_rays: true
    sed_type: LARKIN-40  # selects the SED (path determined automatically)
    linelist_path: ~/mphys/data/cloudy_datafiles/linelist.dat
    yield_path: ~/mphys/data/cloudy_datafiles/pop3_metals.tsv

  sim:

    targets:
      POP3-240:
        [2.5]
    n_side: 8  # n_rays = 12 * n_side**2
    ray_length_kpc: 2.0  # make longer than necessary since not all rays stop at equal distances
    use_first_star: True  # only uses first listed age of first appearing star (for testing)

  misc:

    snap_dir: /cephfs2/brs/pop2-prime/cc_512_no_dust_continue
    cloudy_src_dir: ~/astro_builds/cloudy
    plot_dir: ~/mphys/plots/cloudy_plots
    output_dir: ~/mphys/data/cloudy_outputs/larkin-40
    timeout_s: 3600.0
    cleanup_run_dirs: false
    store_overview: true
    store_continuum: true
    store_lines: true
    sed_dir: ~/mphys/data/cloudy_datafiles/seds
    larkin_260_path: ~/mphys/data/larkin/atlas-T110422-L5p0978-Y24-Zm5-z=0-pop_iii.spect.dat
    larkin_40_path: ~/mphys/data/larkin/atlas-T83800-L5p2326-Y24-Zm5-z=0-pop_iii.spect.dat
    schaerer_40_path: ~/
    nakajima_path: ~/mphys/data/Models_popIII_NakajimaMaiolino2022.dat 

# these are (mostly) legacy fields
spheres:

  sp_dir: ~/mphys/data/spheres
  data_dir: /cephfs2/brs/pop2-prime/cc_512_no_dust_continue
  sp_radius: 1.0
  sp_radius_unit: "kpc"

stars:

  ledger_path: ~/mphys/data/pop3_ledger.parquet
  process_stars: ["POP3-240", "POP3-379"]
  max_metallicity: 1.0e-4

plots:

  proj_dir: ~/mphys/data/projections
  frame_dir: ~/mphys/plots/frames
  profile_plot_dir: ~/mphys/plots/profiles
  film_dir: ~/mphys/plots/films
  axis: "x"
  framerate: 60
  frame_width: 1.5  # kpc
  post_death: 125.0  # Myr

