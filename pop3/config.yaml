# configuration file for params

cloudy:
  cloudy_dir: ~/astro_builds/cloudy
  datafile_dir: ~/mphys/data/cloudy_datafiles
  output_dir: ~/mphys/data/cloudy_outputs
  snap_path: /cephfs2/brs/pop2-prime/cc_512_no_dust_continue/DD0528/DD0528
  timeout_s: 3600.0
  star: POP3-379
  ray_length_kpc: 1.0
  primordial_XH: 0.752
  n_side: 8  # n_rays = 12 * n_side**2
  homogeneous: false

spheres:
  sp_dir: ~/mphys/data/spheres
  data_dir: /cephfs2/brs/pop2-prime/cc_512_no_dust_continue
  sp_radius: 1.0
  sp_radius_unit: "kpc"

stars:
  ledger_path: ~/mphys/data/pop3_ledger.parquet
  process_stars: ["POP3-240", "POP3-379"]
  max_metallicity: 1.0e-4

plots:
  proj_dir: ~/mphys/data/projections
  frame_dir: ~/mphys/plots/frames
  profile_plot_dir: ~/mphys/plots/profiles
  film_dir: ~/mphys/plots/films
  axis: "x"
  framerate: 60
  frame_width: 1.5  # kpc
  post_death: 125.0  # Myr

